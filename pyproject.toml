[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bspforge"
version = "0.4.0"
description = "Evidence-driven SDK semantic recovery and multi-RTOS BSP generation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "BSPForge contributors"}]
dependencies = []

[project.scripts]
bspforge = "bspforge.cli:main"

[tool.setuptools.packages.find]
include = ["bspforge*"]
