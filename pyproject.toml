[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bspforge"
version = "0.6.0"
description = "Evidence-driven SDK semantic recovery and multi-RTOS BSP generation"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "BSPForge contributors"}]
dependencies = []

[project.optional-dependencies]
analysis = ["tree-sitter>=0.24", "tree-sitter-c>=0.23"]
learning = ["lightgbm>=4.5", "scikit-learn>=1.5"]
hardware = ["pyserial>=3.5"]
dev = ["tree-sitter>=0.24", "tree-sitter-c>=0.23", "pyserial>=3.5"]

[project.scripts]
bspforge = "bspforge.cli:main"
bspforge-hwtest = "bspforge.hardware_test.host:main"

[tool.setuptools.packages.find]
include = ["bspforge*"]
